<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LireMonde — Admin</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav>
    <div class="nav-inner">
      <a href="index.html" class="logo">Lire<span>Monde</span></a>
      <ul>
        <li><a href="index.html">Accueil</a></li>
        <li><a href="alire.html">À lire</a></li>
        <li><a href="admin.html" class="actif">Admin</a></li>
      </ul>
    </div>
  </nav>

  <main class="admin-main">

    <!-- FORMULAIRE -->
    <section class="form-section">
      <h2 id="form-titre">➕ Ajouter un livre</h2>
      <form id="form-livre">
        <input type="hidden" id="champ-id" />
        <input type="text"   id="champ-titre"       placeholder="Titre"       required />
        <input type="text"   id="champ-auteur"      placeholder="Auteur"      required />
        <select id="champ-genre">
          <option value="Classique">Classique</option>
          <option value="Science-fiction">Science-fiction</option>
          <option value="Drame">Drame</option>
          <option value="Fantasy">Fantasy</option>
        </select>
        <textarea id="champ-description" placeholder="Description" required></textarea>
        <input type="text" id="champ-couverture" placeholder="URL couverture (optionnel)" />
        <div class="form-actions">
          <button type="submit" id="btn-submit">➕ Ajouter le livre</button>
          <button type="button" id="btn-annuler" style="display:none">✖ Annuler</button>
        </div>
      </form>
    </section>

    <!-- TABLEAU -->
    <section class="tableau-section">
      <h2>📚 Liste des livres</h2>
      <table>
        <thead>
          <tr>
            <th>Titre</th>
            <th>Auteur</th>
            <th>Genre</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="corps-tableau"></tbody>
      </table>
    </section>

  </main>

  <footer>
    <strong>LireMonde</strong> © 2025 — ReadSphere
  </footer>

  <script src="script.js"></script>
</body>
</html>
